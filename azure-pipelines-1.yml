stages:
  - stage: BuildImage
    displayName: Simulator Build Push
    jobs:
      - job: BuildAndPush
        displayName:  Build and push Simulator image
        steps:
        - checkout: self
        - task: Docker@2
          displayName: Build Simulator image
          inputs:
            containerRegistry: 'acr-service'
            repository: 'simulator-service'
            command: 'buildAndPush'
            Dockerfile: '$(Build.SourcesDirectory)/axion-data-simulator/Dockerfile'
            tags: |
              $(Build.BuildId)
              latest
        
  - stage: 
    displayName: deploy Simulator to aks
    dependsOn: BuildImage
    condition: succeeded()
    jobs:
      - deployment: DiployISimulator
        displayName: deploy Simulator service
        environment: axion-deployemnt
        strategy:
         runOnce:
           deploy:
             steps:
                - checkout: self
                - task: KubernetesManifest@1
                  inputs:
                    action: 'deploy'
                    connectionType: 'kubernetesServiceConnection'
                    kubernetesServiceConnection: 'aks-service'
                    namespace: 'default'
                    manifests: |
                     $(Build.SourcesDirectory)/axion-data-simulator/simulator-deployment.yaml
                     $(Build.SourcesDirectory)/axion-data-simulator/simulator-service.yaml
                    containers: 'clusteraliregistry.azurecr.io/simulator-service:$(Build.BuildId)'