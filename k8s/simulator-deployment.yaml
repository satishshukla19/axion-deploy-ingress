apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: satish-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: clusteraliregistry.azurecr.io/simulator:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
